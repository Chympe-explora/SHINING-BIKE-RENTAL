<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Shining Bike Rental — Admin Dashboard</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<!--
  ADMIN DASHBOARD
  ---------------
  Edit everything visitors see, then press Publish. Publishing writes
  site-data.json (and any photos you added) straight into your GitHub
  repository; GitHub Pages then updates the live site (about a minute).
  Every visitor sees the change — not just this browser.

  The site's built-in defaults still live in config.js; this dashboard
  reads them so you always see what visitors currently see.

  Security: publishing needs your GitHub access token (kept only in this
  browser). Without it, nobody can change the live site from this page.
-->
<style>
  :root{ color-scheme: dark; --brand:#2E8B57; --brand2:#257a4b; --line:rgba(255,255,255,.12); --mut:rgba(255,255,255,.64); --bad:#e0574a; --warn:#e8b04a;
    /* the same "raised glass" recipe the public website uses for its cards, buttons and header */
    --glass-shadow: 0 1px 0 rgba(255,255,255,.16) inset, 0 -18px 28px -20px rgba(0,0,0,.55) inset, 0 1px 2px rgba(0,0,0,.3), 0 4px 10px rgba(0,0,0,.28), 0 18px 40px rgba(0,0,0,.4);
    --btn-shadow: 0 1px 0 rgba(255,255,255,.18) inset, 0 -3px 6px rgba(0,0,0,.24) inset, 0 1px 2px rgba(0,0,0,.35), 0 3px 8px rgba(0,0,0,.3);
    --btn-shadow-hover: 0 1px 0 rgba(255,255,255,.22) inset, 0 -3px 6px rgba(0,0,0,.24) inset, 0 3px 6px rgba(0,0,0,.35), 0 10px 22px rgba(0,0,0,.4); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth;background:#0b0f0d}
  body{margin:0;min-height:100vh;font-family:Inter,Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;font-size:15px;line-height:1.5;background:transparent}
  /* Same fixed photo background + dark shade as the website */
  #bgLayer{position:fixed;inset:0;z-index:-100;background:#0b0f0d center/cover no-repeat;transition:background-image .3s}
  #bgVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  #bgShade{position:fixed;inset:0;z-index:-99;background:#000;opacity:.5;pointer-events:none;transition:opacity .3s}
  .wrap{max-width:880px;margin:0 auto;padding:6px 12px 90px}

  /* ---- Header (same glass pill as the website's header) ---- */
  header.top{position:sticky;top:0;z-index:30;padding:12px 12px 0}
  .top-in{max-width:880px;margin:0 auto}
  .hglass{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:24px;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 -10px 18px -14px rgba(0,0,0,.5) inset,0 2px 4px rgba(0,0,0,.3),0 10px 26px rgba(0,0,0,.4)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
  .brand>div{min-width:0;line-height:1.2}
  .brand img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid rgba(255,255,255,.2);flex:none}
  .brand b{display:block;font-size:13px;letter-spacing:.12em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;letter-spacing:.18em;color:rgba(255,255,255,.7);margin-top:1px;text-transform:uppercase}
  .status{font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.14);white-space:nowrap;background:rgba(255,255,255,.08)}
  .status.dirty{background:rgba(232,176,74,.16);border-color:rgba(232,176,74,.55);color:#ffd792}
  .status.clean{background:rgba(46,139,87,.18);border-color:rgba(46,139,87,.55);color:#a8ffcf}
  /* Tabs = the website's segmented nav pill */
  .tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding:6px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 -6px 10px -6px rgba(0,0,0,.4) inset,0 6px 16px rgba(0,0,0,.35)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:9px 16px;border-radius:999px;background:transparent;border:0;color:rgba(255,255,255,.82);font:inherit;font-size:13px;cursor:pointer;transition:background-color .18s,transform .18s}
  .tab:hover{background:rgba(255,255,255,.1);color:#fff}
  .tab.on{background:#fff;color:#000;font-weight:600}

  /* ---- Glass panels ---- */
  .card,details.veh,.sec{background:rgba(14,26,19,.46);border:1px solid rgba(255,255,255,.12);border-radius:24px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--glass-shadow)}
  .card{padding:22px;margin:0 0 18px}
  .card.head{text-align:center;padding:28px 20px;margin-top:16px}
  h1{font-size:26px;margin:0;font-weight:600;line-height:1.15}
  h2{font-size:18px;margin:0 0 4px;font-weight:600}
  h3{font-size:15px;margin:22px 0 6px;color:#fff;font-weight:600}
  p.sub{color:rgba(255,255,255,.7);font-size:14px;margin:8px auto 0;max-width:560px}
  .card>h2+p.sub{margin-left:0;margin-top:2px}
  label.f{display:block;margin:14px 0 0}
  label.f>span{display:block;font-size:12.5px;color:var(--mut);margin-bottom:6px}
  label.f>small,.hint{display:block;font-size:12.5px;color:var(--mut);margin-top:6px;opacity:.9}
  input[type=text],input[type=number],input[type=url],input[type=password],input[type=tel],textarea,select{width:100%;padding:13px 15px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font:inherit;font-size:16px;box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 -1px 3px rgba(0,0,0,.2) inset,0 2px 6px rgba(0,0,0,.18)}
  input::placeholder,textarea::placeholder{color:rgba(255,255,255,.35)}
  textarea{resize:vertical;min-height:46px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:rgba(52,211,153,.55)}
  select option{background:#16221b;color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:640px){.grid4{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:420px){.grid2{grid-template-columns:1fr}}

  /* ---- Buttons (green pill + raised bevel, like the website) ---- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 22px;border:0;border-radius:999px;background:#2E8B57;color:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;white-space:nowrap;box-shadow:var(--btn-shadow);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease,background-color .16s}
  .btn:hover{background:#257a4b;transform:translateY(-2px);box-shadow:var(--btn-shadow-hover);filter:brightness(1.06)}
  .btn:active{transform:translateY(1px);box-shadow:0 2px 5px rgba(0,0,0,.35) inset,0 1px 2px rgba(0,0,0,.25)}
  .btn:disabled{opacity:.45;cursor:default;transform:none;filter:none}
  .btn.ghost{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12)}
  .btn.ghost:hover{background:rgba(255,255,255,.16)}
  .btn.danger{background:var(--bad)}
  .btn.sm{padding:8px 14px;font-size:13px}
  .btn.full{width:100%;margin-top:14px;padding:15px 22px;font-size:15px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .row.sp{justify-content:space-between}
  .tg{display:flex;gap:12px;align-items:flex-start;margin:16px 0 0;cursor:pointer}
  .tg input{position:absolute;opacity:0;pointer-events:none}
  .tg .sw{flex:none;width:46px;height:28px;border-radius:999px;background:rgba(255,255,255,.18);position:relative;transition:.15s;margin-top:0}
  .tg .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .tg input:checked+.sw{background:#2E8B57}
  .tg input:checked+.sw::after{left:21px}
  .tg .tl{font-size:15px}
  .tg .tl small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}

  /* ---- Vehicles ---- */
  details.veh{margin:0 0 16px;overflow:hidden}
  details.veh>summary{list-style:none;display:flex;gap:14px;align-items:center;padding:16px 18px;cursor:pointer}
  details.veh>summary::-webkit-details-marker{display:none}
  details.veh[open]>summary{border-bottom:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04)}
  .vthumb{flex:none;width:64px;height:64px;border-radius:16px;background:rgba(255,255,255,.08);object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:26px;border:1px solid rgba(255,255,255,.12)}
  .vmeta{min-width:0;flex:1}
  .vmeta b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vmeta small{color:var(--mut);font-size:13px}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;background:rgba(232,176,74,.16);border:1px solid rgba(232,176,74,.5);color:#ffd792;margin-left:8px;vertical-align:middle}
  .chev{flex:none;opacity:.6;transition:.15s}
  details[open]>summary .chev{transform:rotate(180deg)}
  .vbody{padding:6px 18px 20px}
  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:10px}
  .ph{position:relative;border-radius:16px;overflow:hidden;background:rgba(255,255,255,.07);aspect-ratio:4/3;border:1px solid rgba(255,255,255,.12)}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .n{position:absolute;left:6px;top:6px;font-size:11px;font-weight:600;background:rgba(0,0,0,.65);padding:2px 8px;border-radius:999px}
  .ph .acts{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:4px;padding:6px;background:linear-gradient(to top,rgba(0,0,0,.75),transparent)}
  .ph .acts button{border:0;border-radius:10px;background:rgba(255,255,255,.22);color:#fff;font-size:14px;padding:6px 10px;cursor:pointer;line-height:1}
  .ph .acts button.x{background:rgba(224,87,74,.88)}
  .addph{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;border:2px dashed rgba(255,255,255,.28);border-radius:16px;aspect-ratio:4/3;cursor:pointer;color:var(--mut);font-size:13px;text-align:center;padding:6px;background:rgba(255,255,255,.03)}
  .addph:hover{border-color:#2E8B57;color:#fff}
  .addph b{font-size:24px;line-height:1;color:#fff}
  .imgrow{display:flex;gap:14px;align-items:center}
  .thumb{width:104px;height:78px;border-radius:14px;object-fit:cover;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);flex:none}
  .thumb.empty{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
  .imgbtns{display:flex;gap:8px;flex-wrap:wrap}
  .item{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .item:last-child{border-bottom:0}
  .item .grow{flex:1;min-width:0}
  .mini{display:flex;gap:6px;flex:none}
  .mini button{width:36px;height:36px;padding:0;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.1);color:#fff;font-size:15px;cursor:pointer;box-shadow:var(--btn-shadow)}
  .mini button:disabled{opacity:.35;cursor:default}
  .mini button.x{background:rgba(224,87,74,.88);border-color:transparent}
  .block{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:12px 14px;margin-top:12px;box-shadow:0 1px 0 rgba(255,255,255,.1) inset,0 -1px 3px rgba(0,0,0,.2) inset,0 2px 6px rgba(0,0,0,.18)}
  .block .bh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
  .sec{padding:16px 18px;margin:0 0 16px}
  .sec .sh{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sec .sh b{font-size:16px;font-weight:600}
  .msg{border-radius:16px;padding:12px 15px;font-size:14px;margin-top:14px}
  .msg.ok{background:rgba(46,139,87,.18);border:1px solid rgba(46,139,87,.55);color:#b9ffd9}
  .msg.err{background:rgba(224,87,74,.16);border:1px solid rgba(224,87,74,.55);color:#ffc0b8}
  .msg.info{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#e6eee9}
  ol.steps{margin:10px 0 0;padding-left:20px;color:#e6eee9;font-size:14px}
  ol.steps li{margin:6px 0}
  code{background:rgba(255,255,255,.12);padding:1px 6px;border-radius:6px;font-size:12.5px}
  a{color:#8fe3b4}
  #busy{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #busy.on{display:flex}
  #busy .box{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:26px 28px;max-width:360px;width:100%;text-align:center;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--glass-shadow)}
  .spin{width:32px;height:32px;border-radius:50%;border:3px solid rgba(255,255,255,.2);border-top-color:#8fe3b4;margin:0 auto 12px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);z-index:120;background:rgba(20,45,30,.92);border:1px solid rgba(46,139,87,.7);color:#d7ffe8;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center;backdrop-filter:blur(12px)}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:rgba(58,28,25,.94);border-color:rgba(224,87,74,.7);color:#ffd2cc}
  input[type=range]{width:100%;accent-color:#2E8B57}
  .pubbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:25;display:none}
  .pubbar.on{display:block}
  .pubbar .in{max-width:880px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px 10px 20px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--glass-shadow)}
  .pubbar span{font-size:14px;color:#ffd792;font-weight:500}
</style>
</head>
<body>
<div id="bgLayer"><video id="bgVideo" muted loop playsinline autoplay preload="auto"></video></div><div id="bgShade"></div>
<header class="top"><div class="top-in">
  <div class="hglass">
    <div class="brand"><img id="brandLogo" src="logo.png" alt=""><div><b id="brandName">Admin Dashboard</b><small>Admin Dashboard</small></div></div>
    <div class="row" style="gap:8px;flex-wrap:nowrap;flex:none">
      <span class="status clean" id="status">Loading…</span>
      <a class="btn ghost sm" href="index.html" target="_blank" rel="noopener" aria-label="View the website">Site ↗</a>
    </div>
  </div>
  <nav class="tabs" id="tabs"></nav>
</div></header>

<div class="wrap"><main id="view"></main></div>

<div class="pubbar" id="pubbar"><div class="in"><span>● Unpublished changes</span><button class="btn sm" data-act="publish">Publish now</button></div></div>
<div id="busy"><div class="box"><div class="spin"></div><div id="busyMsg">Working…</div></div></div>
<div id="toast"></div>

<script>window.showConfigError=function(m){try{console.warn(m)}catch(e){}};</script>
<script src="config.js"></script>
<script>
(function () {
"use strict";

/* =====================================================================
   0. Tiny helpers
   ===================================================================== */
function $(s, r) { return (r || document).querySelector(s); }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function isObj(v) { return v !== null && typeof v === "object" && !Array.isArray(v); }
function isOn(v, d) { if (v === false || v === "false") return false; if (v === true || v === "true") return true; return d; }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function deepMerge(base, over) {
  if (over === undefined || over === null) return base;
  if (Array.isArray(over)) return clone(over);
  if (!isObj(over)) return over;
  var out = {};
  if (isObj(base)) { for (var k in base) out[k] = base[k]; }
  for (var k2 in over) out[k2] = deepMerge(out[k2], over[k2]);
  return out;
}
function getPath(o, p) { var parts = p.split("."); for (var i = 0; i < parts.length; i++) { if (o == null) return undefined; o = o[parts[i]]; } return o; }
function setPath(o, p, v) { var parts = p.split("."); for (var i = 0; i < parts.length - 1; i++) { if (o[parts[i]] == null) o[parts[i]] = {}; o = o[parts[i]]; } o[parts[parts.length - 1]] = v; }
function uid(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function slug(s) { return String(s || "").toLowerCase().replace(/\.[a-z0-9]+$/, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 28) || "file"; }
function money(n) { return "₹" + Number(n || 0).toLocaleString("en-IN"); }

/* =====================================================================
   1. Defaults (from config.js) + model <-> site content conversion
   ===================================================================== */
var CFG = window.KC_CONTENT || {};
var CFG_PRICES = (window.KC_PRICES && window.KC_PRICES.vehicleRental && window.KC_PRICES.vehicleRental.vehicles) || {};
var NAV_KINDS = { home: "Home", vehicles: "Vehicles section", terms: "Rental Terms page", contact: "Contact / footer", whatsapp: "Open WhatsApp chat", url: "Open a web link" };

function normPrices(p) {
  p = p || {};
  return { "6": Number(p["6"]) || 0, "12": Number(p["12"]) || 0, "24": Number(p["24"]) || 0, deposit: Number(p.deposit) || 0 };
}

function navToModel(item) {
  if (typeof item === "string") { var k = item.trim().toLowerCase(); return { label: item, kind: NAV_KINDS[k] && k !== "whatsapp" && k !== "url" ? k : "vehicles", url: "" }; }
  item = item || {};
  if (item.url) return { label: item.label || "", kind: "url", url: item.url };
  if (item.whatsapp) return { label: item.label || "", kind: "whatsapp", url: "" };
  var t = String(item.target || "").toLowerCase();
  return { label: item.label || "", kind: (t === "home" || t === "vehicles" || t === "terms" || t === "contact") ? t : "vehicles", url: "" };
}

function contentToModel(C) {
  C = C || {};
  var hero = C.hero || {}, bg = (C.background && C.background.global) || {}, ov = bg.overlay || {};
  var ui = C.ui || {}, nt = C.notice || {}, an = C.announcement || {}, vr = C.vehicleRental || {};
  var rp = C.refundPolicy || {}, rw = rp.whatsapp || {}, ft = C.footer || {};
  return {
    siteName: C.siteName || "", siteSub: C.siteSub || "", logoImage: C.logoImage || "",
    whatsappNumber: C.whatsappNumber || "", instagram: C.instagram || "",
    hero: { badge: hero.badge || "", title: hero.title || "", sub: hero.sub || "", quote: hero.quote || "", bookNowLabel: hero.bookNowLabel || "", discoverLabel: hero.discoverLabel || "" },
    bg: {
      videoEnabled: isOn(bg.videoEnabled, true),
      videoUrl: bg.videoUrl || hero.videoUrl || "",
      fallbackImage: bg.fallbackImage || hero.fallbackImage || "",
      overlay: isOn(ov.enabled, true) ? (ov.opacity != null ? Number(ov.opacity) : 40) : 0
    },
    nav: ((C.nav && C.nav.items) || []).map(navToModel),
    ui: { bookNow: ui.bookNow || "", backToHome: ui.backToHome || "", adminLinkLabel: ui.adminLinkLabel || "Admin", showAdminLink: isOn(ui.showAdminLink, true) },
    notice: { enabled: isOn(nt.enabled, false), title: nt.title || "", subtitle: nt.subtitle || "", text: nt.text || "", buttonText: nt.buttonText || "", showAgain: nt.showAgain || "" },
    announcement: { enabled: isOn(an.enabled, false), text: an.text || "" },
    vehicleRental: {
      title: vr.title || "", subtitle: vr.subtitle || "", operatingHoursNote: vr.operatingHoursNote || "",
      searchTitle: vr.searchTitle || "", searchPlaceholder: vr.searchPlaceholder || "", noResultsTitle: vr.noResultsTitle || "", noResultsText: vr.noResultsText || "",
      clearSearchLabel: vr.clearSearchLabel || "", rentNowLabel: vr.rentNowLabel || "", depositLabel: vr.depositLabel || "", photosComingSoon: vr.photosComingSoon || "",
      vehicles: (vr.vehicles || []).map(function (v) {
        return {
          id: v.id || uid("v"), name: v.name || "", description: v.description || "", details: v.details || "", badge: v.badge || "",
          features: (v.features || []).slice(),
          images: ((v.images && v.images.length) ? v.images : (v.image ? [v.image] : [])).filter(Boolean),
          visible: isOn(v.visible, true),
          prices: normPrices(v.prices || CFG_PRICES[v.id])
        };

/* =====================================================================
   3. Media — compress photos, keep them in memory until publish
   ===================================================================== */
function mediaUrl(p) {
  if (!p) return "";
  if (pending[p]) { if (!urlCache[p]) urlCache[p] = URL.createObjectURL(pending[p].blob); return urlCache[p]; }
  if (/^(https?:|data:|blob:)/i.test(p)) return p;
  return encodeURI(p);
}
function newPath(name, ext) { return "uploads/" + slug(name) + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5) + "." + ext; }

function compressImage(file, keepAlpha) {
  return new Promise(function (resolve, reject) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      URL.revokeObjectURL(url);
      var w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, 1600 / Math.max(w, h));
      w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
      var c = document.createElement("canvas"); c.width = w; c.height = h;
      var ctx = c.getContext("2d");
      var png = !!keepAlpha;
      if (!png) { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h); }
      ctx.drawImage(img, 0, 0, w, h);
      c.toBlob(function (b) {
        if (!b) return reject(new Error("Couldn't process \"" + file.name + "\"."));
        resolve({ blob: b, ext: png ? "png" : "jpg", mime: png ? "image/png" : "image/jpeg" });
      }, png ? "image/png" : "image/jpeg", 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("Couldn't read \"" + file.name + "\" as a picture. Please use a JPG or PNG.")); };
    img.src = url;
  });
}

async function storeImage(file, keepAlpha) {
  var r = await compressImage(file, !!keepAlpha && /png|webp|gif|svg/i.test(file.type));
  var p = newPath(file.name, r.ext);
  pending[p] = { blob: r.blob, mime: r.mime, uploaded: false };
  return p;
}
async function storeVideo(file) {
  if (!/mp4/i.test(file.type) && !/\.mp4$/i.test(file.name)) throw new Error("Please choose an MP4 video.");
  if (file.size > 40 * 1024 * 1024) throw new Error("That video is " + Math.round(file.size / 1048576) + " MB. Please use one under 40 MB (try compressing it first).");
  var p = newPath(file.name, "mp4");
  pending[p] = { blob: file, mime: "video/mp4", uploaded: false };
  return p;
}

/* =====================================================================
   4. Draft autosave (IndexedDB) — survives closing the tab
   ===================================================================== */
function idb() {
  return new Promise(function (res, rej) {
    if (!window.indexedDB) return rej(new Error("no idb"));
    var r = indexedDB.open("kc-admin", 1);
    r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
    r.onsuccess = function () { res(r.result); };
    r.onerror = function () { rej(r.error); };
  });
}
function idbOp(mode, fn) {
  return idb().then(function (db) { return new Promise(function (res, rej) {
    var tx = db.transaction("kv", mode), st = tx.objectStore("kv"), rq = fn(st);
    tx.oncomplete = function () { res(rq && rq.result); }; tx.onerror = function () { rej(tx.error); }; tx.onabort = function () { rej(tx.error); };
  }); });
}
function draftGet() { return idbOp("readonly", function (s) { return s.get("draft"); }).catch(function () { return null; }); }
function draftSet(v) { return idbOp("readwrite", function (s) { return s.put(v, "draft"); }).catch(function () {}); }
function draftDel() { return idbOp("readwrite", function (s) { return s.delete("draft"); }).catch(function () {}); }

  var list = [];

}

async function handleUpload(mode, files, ds) {
  if (!files.length) return;
  if (mode === "import") return importJson(files[0]);
  busy(mode === "video" ? "Adding video…" : files.length > 1 ? "Processing photos…" : "Processing photo…");
  try {
    if (mode === "one") setPath(M, ds.path, await storeImage(files[0], !!ds.alpha));
    else if (mode === "video") setPath(M, ds.path, await storeVideo(files[0]));
    else if (mode === "veh") {
      var v = vehs()[+ds.i], errs = [];
      for (var k = 0; k < files.length; k++) { try { v.images.push(await storeImage(files[k], false)); } catch (er) { errs.push(er.message); } }
      if (errs.length) toast(errs[0], true);
    }
    changed(); render(true);
  } catch (err) { toast(err.message || "Upload failed.", true); }
  finally { busyDone(); }
}

function normFolder(f) { return String(f || "").trim().replace(/^\/+|\/+$/g, ""); }
function encPath(p) { return String(p).split("/").map(encodeURIComponent).join("/"); }
function repoPath(p) { return "/repos/" + gh.repo + p; }
function friendly(status, msg) {
  if (status === 401) return "GitHub rejected the token — it may be expired or mistyped. Create a new token and paste it again.";
  if (status === 403) return "GitHub says this token isn't allowed to do that (" + msg + "). Make sure the token includes this repository and “Contents” is set to Read and write.";
  if (status === 404) return "GitHub couldn't find that repository or branch (or the token can't see it). Check the repository name, branch, and that the token was given access to this repository.";
  return "GitHub error " + status + ": " + msg;
}
async function ghApi(method, path, body) {
  var headers = { "Authorization": "Bearer " + gh.token, "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  if (body) headers["Content-Type"] = "application/json";
  var res;
  try { res = await fetch("https://api.github.com" + path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { var er = new Error("Couldn't reach GitHub — check your internet connection and try again."); er.status = 0; throw er; }
  var data = null; try { data = await res.json(); } catch (e) {}
  if (!res.ok) { var err = new Error(friendly(res.status, (data && data.message) || res.statusText)); err.status = res.status; throw err; }
  return data;
}
function blobToBase64(blob) {
  return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(",")[1] || ""); }; r.onerror = function () { rej(r.error); }; r.readAsDataURL(blob); });
}

async function ghTest() {
  function say(cls, m) { var el = $("#ghMsg"); if (el) el.innerHTML = '<div class="msg ' + cls + '">' + m + "</div>"; }
  gh.repo = String(gh.repo || "").replace(/^https?:\/\/github\.com\//i, "").replace(/\.git$/i, "").replace(/^\/+|\/+$/g, "");
  if (!/^[\w.-]+\/[\w.-]+$/.test(gh.repo)) return say("err", "The repository should look like <code>your-username/your-repository</code>.");
  if (!gh.token) return say("err", "Paste your access token first.");
  busy("Checking the connection…");
  try {
    var repo = await ghApi("GET", "/repos/" + gh.repo);
    if (!gh.branch) gh.branch = repo.default_branch || "main";
    var folder = normFolder(gh.folder), note = "", tree = null;
    try { tree = await ghApi("GET", repoPath("/git/trees/" + encodeURIComponent(gh.branch) + "?recursive=1")); }
    catch (e) { if (e.status === 404 || e.status === 409) throw new Error("The branch “" + gh.branch + "” wasn't found in that repository. Check the branch name."); throw e; }
    if (tree && !tree.truncated) {
      var paths = tree.tree.filter(function (x) { return x.type === "blob"; }).map(function (x) { return x.path; });
      if (paths.indexOf((folder ? folder + "/" : "") + "index.html") === -1) {
        var c = paths.filter(function (p) { return p === "admin.html" || /\/admin\.html$/.test(p); });
        if (c.length === 1) { folder = c[0].replace(/admin\.html$/, "").replace(/\/$/, ""); note = " Found your website files " + (folder ? "in the folder <code>" + esc(folder) + "</code>." : "at the top level of the repository."); }
        else if (!c.length) throw new Error("Connected, but I can't find your website files (admin.html) on branch “" + gh.branch + "”. Check the branch and folder.");
        else throw new Error("I found admin.html in several places (" + c.map(esc).join(", ") + "). Type the right folder in “Folder of the website”.");
      }
    }
    gh.folder = folder; saveGh();
    render(true);
    say("ok", "✓ Connected to <b>" + esc(gh.repo) + "</b> (branch <code>" + esc(gh.branch) + "</code>). You can publish now." + note);
  } catch (e) { say("err", esc(e.message || String(e))); }
  finally { busyDone(); }
}

function validate() {
  var errs = [], wa = String(M.whatsappNumber || "").replace(/\D/g, "");
  if (!/^\d{10,15}$/.test(wa)) errs.push("The WhatsApp number must be 10–15 digits including the country code (Menu & footer tab).");
  vehs().forEach(function (v, i) { if (!String(v.name || "").trim()) errs.push("Vehicle " + (i + 1) + " needs a name (Vehicles tab)."); });
  M.nav.forEach(function (n) { if (n.kind === "url" && !/^https?:\/\//i.test(String(n.url || ""))) errs.push("The menu link “" + n.label + "” needs a web address starting with https:// (Menu & footer tab)."); });
  if (M.notice.enabled && !String(M.notice.text).trim()) errs.push("The pop-up notice is switched on but has no message (Notices tab).");
  if (M.announcement.enabled && !String(M.announcement.text).trim()) errs.push("The announcement bar is switched on but has no text (Notices tab).");
  return errs;
}

var pollId = 0;
function setLive() { var el = $("#liveMsg"); if (el) el.innerHTML = liveMsg; }
async function pollLive(updatedAt) {
  var my = ++pollId;
  if (location.protocol === "file:") { liveMsg = '<div class="msg info">Published to GitHub. It will be live in about a minute.</div>'; setLive(); return; }
  liveMsg = '<div class="msg info">⏳ Published to GitHub. Waiting for the live site to update (usually under a minute)…</div>'; setLive();
  for (var i = 0; i < 40; i++) {
    await sleep(5000);
    if (my !== pollId) return;
    try {
      var r = await fetch("site-data.json?cb=" + Date.now(), { cache: "no-store" });
      if (r.ok) { var j = await r.json(); if (j && j.updatedAt === updatedAt) { liveMsg = '<div class="msg ok">✓ Live now — visitors can see your changes.</div>'; setLive(); toast("Your site is live with the new changes ✓"); return; } }
    } catch (e) {}
  }
  if (my === pollId) { liveMsg = '<div class="msg info">Your changes are saved in GitHub, but the live site hasn’t updated yet. This can take a few minutes — and make sure GitHub Pages is switched on for the repository.</div>'; setLive(); }
}

async function publish() {
  if (!M) return;
  if (!gh.token || !gh.repo) { setTab("publish"); toast("Connect GitHub first (one-time setup).", true); return; }
  var errs = validate();
  if (errs.length) { alert("Please fix these before publishing:\n\n• " + errs.join("\n• ")); return; }
  if (!vehs().some(function (v) { return v.visible; }) && !confirm("No vehicle is set to show, so the rental section will be hidden on your website. Publish anyway?")) return;

  var content = modelToContent(M), json = JSON.stringify(content), updatedAt = new Date().toISOString();
  var text = JSON.stringify({ schema: 1, updatedAt: updatedAt, content: content }, null, 2) + "\n";
  var folder = normFolder(gh.folder), prefix = folder ? folder + "/" : "";
  var uploads = Object.keys(pending).filter(function (p) { return !pending[p].uploaded && json.indexOf('"' + p + '"') !== -1; });
  try {
    var entries = [];
    for (var i = 0; i < uploads.length; i++) {
      busy("Uploading file " + (i + 1) + " of " + uploads.length + "…");
      var blob = await ghApi("POST", repoPath("/git/blobs"), { content: await blobToBase64(pending[uploads[i]].blob), encoding: "base64" });
      entries.push({ path: prefix + uploads[i], mode: "100644", type: "blob", sha: blob.sha });
    }
    busy("Saving your changes…");
    var jb = await ghApi("POST", repoPath("/git/blobs"), { content: text, encoding: "utf-8" });
    entries.push({ path: prefix + "site-data.json", mode: "100644", type: "blob", sha: jb.sha });
    var lastErr = null, branch = gh.branch || "main";
    for (var attempt = 0; attempt < 3; attempt++) {
      try {
        var ref = await ghApi("GET", repoPath("/git/ref/heads/" + encPath(branch)));
        var head = ref.object.sha;
        var commit = await ghApi("GET", repoPath("/git/commits/" + head));
        var tree = await ghApi("POST", repoPath("/git/trees"), { base_tree: commit.tree.sha, tree: entries });
        var nc = await ghApi("POST", repoPath("/git/commits"), { message: "Update website content (Admin Dashboard)", tree: tree.sha, parents: [head] });
        await ghApi("PATCH", repoPath("/git/refs/heads/" + encPath(branch)), { sha: nc.sha, force: false });
        lastErr = null; break;
      } catch (e) { lastErr = e; if (e.status !== 422 && e.status !== 409) throw e; await sleep(900); }
    }
    if (lastErr) throw lastErr;
    uploads.forEach(function (p) { pending[p].uploaded = true; });
    published = { schema: 1, updatedAt: updatedAt, content: content };
    baseline = json;
    draftDel();
    busyDone(); render(true);
    toast("Published ✓");
    pollLive(updatedAt);
  } catch (e) {
    busyDone();
    toast(e.message || "Publishing failed.", true);
    alert("Publishing didn't finish:\n\n" + (e.message || e) + "\n\nYour edits are still saved in this browser — nothing was lost.");
  }
}

/* =====================================================================
   11. Minimal ZIP writer (no compression) — for manual uploads
   ===================================================================== */
var CRC_T = (function () { var t = []; for (var n = 0; n < 256; n++) { var c = n; for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[n] = c >>> 0; } return t; })();
function crc32(u8) { var c = 0xFFFFFFFF; for (var i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  var enc = new TextEncoder(), chunks = [], central = [], offset = 0, now = new Date();
  var dt = ((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();
  var tm = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
  files.forEach(function (f) {
    var name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    var lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, tm, true); lh.setUint16(12, dt, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), name, f.data);
    var ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint16(12, tm, true); ch.setUint16(14, dt, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
    ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  });
  var csize = central.reduce(function (a, c) { return a + c.length; }, 0);
  var end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, csize, true); end.setUint32(16, offset, true);
  return new Blob(chunks.concat(central, [new Uint8Array(end.buffer)]), { type: "application/zip" });
}
window.__kcAdmin = { makeZip: makeZip, crc32: crc32 };   // handy for testing

/* =====================================================================
   12. Events + boot
   ===================================================================== */
document.addEventListener("click", function (e) {
  var tb = e.target.closest && e.target.closest("[data-tab]");
  if (tb) { setTab(tb.getAttribute("data-tab")); return; }
  var a = e.target.closest && e.target.closest("[data-act]");
  if (!a || a.disabled) return;
  var fn = ACT[a.getAttribute("data-act")];
  if (fn) { e.preventDefault(); fn(a); }
});

document.addEventListener("input", function (e) {
  var t = e.target, ds = t.dataset || {};
  if (ds.gh) { gh[ds.gh] = t.value.trim(); saveGh(); return; }
  if (!M) return;
  if (ds.b) {
    var val = t.type === "checkbox" ? t.checked : (ds.n ? (t.value === "" ? 0 : Math.max(0, Number(t.value) || 0)) : t.value);
    setPath(M, ds.b, val);
    if (ds.show) { var s = document.getElementById(ds.show); if (s) s.textContent = val + "%"; }
    var m = /^vehicleRental\.vehicles\.(\d+)\.name$/.exec(ds.b);
    if (m) { var el = document.querySelector('details.veh[data-i="' + m[1] + '"] .vname'); if (el) el.textContent = val || "Untitled vehicle"; }
    changed();
  } else if (ds.l) {
    setPath(M, ds.l, t.value.split("\n")); changed();
  }
});

document.addEventListener("change", function (e) {
  var t = e.target, ds = t.dataset || {};
  if (t.type === "file" && ds.up) {
    var files = Array.prototype.slice.call(t.files || []), snap = { path: ds.path, i: ds.i, alpha: ds.alpha };
    t.value = "";
    handleUpload(ds.up, files, snap);
    return;
  }
  if (ds.rerender || (ds.b && /^vehicleRental\.vehicles\.\d+\.visible$/.test(ds.b))) { if (M) render(true); }
});

document.addEventListener("toggle", function (e) {
  var d = e.target;
  if (d && d.matches && d.matches("details.veh")) { openVeh[d.getAttribute("data-vid")] = d.open; }
}, true);

async function boot() {
  try {
    var r = await fetch("site-data.json?cb=" + Date.now(), { cache: "no-store" });
    if (r.ok) { var j = await r.json(); if (isObj(j) && isObj(j.content)) published = j; }
  } catch (e) { /* not published yet, or opened from a file — start from config.js */ }
  M = contentToModel(deepMerge(CFG, published ? published.content : {}));
  baseline = JSON.stringify(modelToContent(M));

  var d = await draftGet();
  if (d && d.model) {
    var dj = JSON.stringify(modelToContent(d.model)), hasPending = (d.pending || []).length > 0;
    if (dj === baseline && !hasPending) { draftDel(); }
    else {
      var keep = true;
      if ((d.baseUpdatedAt || null) !== ((published && published.updatedAt) || null)) {
        keep = confirm("You have unpublished edits saved in this browser, but the live site has changed since then.\n\nOK = keep my saved edits\nCancel = discard them and start from the live site");
      }
      if (keep) {
        M = d.model;
        (d.pending || []).forEach(function (p) { pending[p.path] = { blob: p.blob, mime: p.mime, uploaded: false }; });
        setTimeout(function () { toast("Restored your unpublished edits."); }, 300);
      } else draftDel();
    }
  }
  var h = (location.hash || "").replace("#", "");
  if (TABS.some(function (t) { return t[0] === h; })) tab = h;
  var logo = $("#brandLogo"); if (M.logoImage) logo.src = mediaUrl(M.logoImage);
  render(false);
}
boot();

})();
